spring.application.name=baby-milestones

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/baby_milestones}
spring.datasource.username=${POSTGRES_USER:baby_milestones}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Creating a family needs this code once set; without it only the first family can be created.
app.setup-code=${SETUP_CODE:}

# The in-app assistant. The key stays on the server and is never sent to the app.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5-5}
anthropic.max-tool-rounds=8

# Photos are uploaded as raw image bodies
spring.servlet.multipart.enabled=false
server.tomcat.max-swallow-size=10MB
spring.http.codecs.max-in-memory-size=10MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# No request bodies, notes or milestone text in logs.
logging.level.org.springframework.web=WARN

# MCP server over Streamable HTTP at /mcp, behind the same bearer tokens as the app.
spring.ai.mcp.server.name=baby-milestones
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=You help a family track their baby's development from birth to 5 years. Every answer \
  comes from these tools: the app's milestone content (CDC/AAP 2022 checklists, WHO and NHS guidance, with sources) and \
  the baby's own log. Start with list_babies. Always read before writing; never invent a milestone id or a date. To log \
  what a parent says, find ids with search_guidance and confirm with the parent before log_milestone. Use the baby's \
  name and say whether you mean corrected or chronological age. Checklist ages are when most children (75%+) do \
  something, so a missing milestone is a reason to watch and maybe talk to a health visitor, never a sign of being \
  behind. Never diagnose, name conditions, give screening scores or advise on medicines; use get_concerns' signposts, \
  and for an unwell child point to NHS 111 or 999.
